spring:
  application:
    name: identity-service
  mvc:
    problemdetails:
      enabled: true
  datasource:
    # Lokalnie: rynek-infra/local (docker compose). Inne środowiska ustawiają zmienne.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity}
    username: ${DB_USER:identity}
    password: ${DB_PASSWORD:identity}
  jpa:
    open-in-view: false
    hibernate:
      # Schemat zakłada Flyway (db/migration); Hibernate tylko sprawdza zgodność encji.
      ddl-auto: validate

rynek:
  jwt:
    issuer: ${JWT_ISSUER:rynek-identity}
    # Klucz prywatny RSA (PEM, PKCS#8). Pusty: klucz generowany przy starcie, tylko do pracy lokalnej
    # (po restarcie tokeny dostępowe tracą ważność, frontend odnawia je refresh tokenem).
    private-key: ${JWT_PRIVATE_KEY:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
    # Ponowne użycie zrotowanego refresh tokenu w tym czasie (druga karta) nie unieważnia sesji; później tak.
    refresh-reuse-grace: ${JWT_REFRESH_REUSE_GRACE:30s}

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
